[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coupling-guard-prototype"
version = "0.1.0"
description = "Prototype static Python coupling and change-impact analyzer"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
coupling-guard = "coupling_guard.cli:main"

[tool.setuptools.packages.find]
include = ["coupling_guard*"]
